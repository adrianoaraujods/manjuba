<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majuba | A melhor barbearia de BH</title>
  <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
  <a class="sr-only" href="#main" aria-label="Ir para o conteúdo principal"></a>

  <header class="navbar">
    <nav class="navbar__content">
      <img class="navbar__logo" src="./assets/manjuba.svg" alt="Manjuba logo">

      <ul class="navbar__links">
        <li class="navbar__link">Serviços</li>
        <li class="navbar__link">Barbeiros</li>
        <li class="navbar__link">Agendar</li>
        <li class="navbar__link">Planos</li>
        <li class="navbar__link">Galeria</li>
      </ul>

      <ul class="navbar__socials">
        <li class="navbar__social">
          <a class="navbar__social-link" href="https://www.instagram.com" target="_blank" aria-label="Abir Instagram do Manjuba">
            <img class="navbar__social-icon" src="./assets/instagram.svg" alt="Instagram" >
          </a>  
        </li>
        <li class="navbar__social">
          <a class="navbar__social-link" href="https://x.com/" target="_blank" aria-label="Abir X do Manjuba">
            <img class="navbar__social-icon" src="./assets/x.svg" alt="X" >
          </a>  
        </li>
        <li class="navbar__social">
          <a class="navbar__social-link" href="https://wa.me/5531987654321" target="_blank" aria-label="Chamar Manjuba no WhatsApp">
            <img class="navbar__social-icon" src="./assets/instagram.svg" alt="WhatsApp" >
          </a>  
        </li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <section class="hero-section"></section>
    <section id="services" class="services-section"></section>
    <section id="barbers" class="barbers-section"></section>
    <section id="plans" class=""></section>
    <section id="appointment" class="hero-section"></section>
    <section id="galery" class="hero-section"></section>
  </main>

  <footer class="footer"></footer>
</body>

</html>
